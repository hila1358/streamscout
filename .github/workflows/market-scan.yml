name: Hourly market scan

on:
  schedule:
    - cron: "17 * * * *"  # every hour at :17 (top of the hour is GitHub's busiest slot)
  workflow_dispatch:       # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: market-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan Twitch
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: |
          if [ -z "$TWITCH_CLIENT_ID" ]; then echo "Twitch secrets not added to the repo yet - skipping."; exit 0; fi
          python market_scan.py
      - name: Commit snapshot
        run: |
          git config user.name "streamscout-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market
          git diff --cached --quiet && exit 0
          git commit -m "Market snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
